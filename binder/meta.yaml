package:
  name: binder
  version: v1.4.5

source:
  - git_url: https://github.com/JanNiklasB/binder.git
    git_rev: binder_crpropa
    folder: binder

build:
  script_env:
    - PATH  # [osx]

requirements:
  host:
  - cmake

  run:
  - cmake
  - ninja
  - {{ compiler('c') }}
  - {{ compiler('cxx') }}
  - clang==19.1.7
  - clangxx==19.1.7
  - llvm==19.1.7
  - pybind11

test:
  files:
    - testProject/
  commands:
    - binder --help
    - binder --version
