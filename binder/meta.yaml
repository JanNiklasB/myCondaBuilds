package:
  name: binder
  version: v1.4.5

source:
  - git_url: https://github.com/JanNiklasB/binder.git
    git_rev: binder_crpropa
    folder: binder

build:
  script_env:
    - ADDPATH  # [osx]

requirements:
  build:
  - coreutils  # [osx]
  - xz  # [osx]
  - pybind11  # [osx]
  - git  # [osx]
  - cmake  # [osx]
  - ninja  # [osx]

  run:
  # - coreutils  # [osx]
  # - xz  # [osx]
  - cmake
  - ninja
  - {{ compiler('c') }}
  - {{ compiler('cxx') }}
  - clang==19.1.7  # [linux]
  - clangxx==19.1.7  # [linux]
  - llvm==19.1.7  # [linux]
  - clang==14.0.6  # [osx]
  - clangxx==14.0.6  # [osx]
  - llvm==14.0.6  # [osx]
  - pybind11>3

test:
  files:
    - testProject/
  commands:
    - binder --help
    - binder --version
