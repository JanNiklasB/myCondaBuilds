name: binder_conda_package
on:
#   push:
#     branches: 
#       - master
#       - releases/**
#     paths:
#       - ".github/workflows/binder_conda_package.yml"
#       - "**.cpp"
#       - "**.h"
#       - "**.py"
#       - "**.i"
#       - "**/CMakeLists.txt"
#       - "conda-build/*"
#   release:
#     types: [published]
  workflow_dispatch:

jobs:
  arm:
    runs-on: ubuntu-22.04-arm
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Miniconda
        run: |
          set -ex
          ldd --version
          cd ~
          wget https://repo.anaconda.com/miniconda/Miniconda3-latest-Linux-aarch64.sh &> /dev/null
          sh Miniconda3-latest-Linux-aarch64.sh -b
      - name: Install Additional Conda Packages
        # the path is reseted in each new step:
        run: |
          source ~/miniconda3/bin/activate
          set -ex
          conda init &> /dev/null
          conda update -n base conda -y &> /dev/null
          conda install conda-build anaconda-client -y &> /dev/null
      - name: Build Conda Package
        env:
          accountName: ${{ secrets.ANACONDA_ACCOUNTNAME }}
          token: ${{ secrets.ANACONDA_TOKEN }}
        run: |
          source ~/miniconda3/bin/activate
          set -ex
          conda init &> /dev/null
          cd binders
          conda config --set anaconda_upload yes
          conda build -m conda_build_config.yaml -c conda-forge . -k \
            --user $accountName \
            --token $token \
            | tee build.log
          if [ $(find ~/miniconda3/conda-bld/linux-aarch64 -name "binders*" | wc -l) = 1 ]; then echo Success! ; else exit 1; fi
      - name: Archive Build Logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: "Anaconda_Build_ARM_Log"
          path: binders/build.log

  x64:
    runs-on: ubuntu-22.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Preinstall
        run: |
          set -ex
          ldd --version
          conda init &> /dev/null
          conda update -n base conda -y &> /dev/null
          conda install conda-build anaconda-client -y &> /dev/null
      - name: Build Conda Package
        env:
          accountName: ${{ secrets.ANACONDA_ACCOUNTNAME }}
          token: ${{ secrets.ANACONDA_TOKEN }}
        run: |
          set -ex
          conda init &> /dev/null
          cd binders
          conda config --set anaconda_upload yes
          conda build -m conda_build_config.yaml -c conda-forge . -k \
            --user $accountName \
            --token $token \
            | tee build.log
          if [ $(find /usr/share/miniconda/conda-bld/linux-64 -name "binders*" | wc -l) = 1 ]; then echo Success! ; else exit 1; fi
      - name: Archive Build Logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: "Anaconda_Build_x64_Log"
          path: binders/build.log

  macos:
    runs-on: macos-14
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Install Miniconda
        run: |
          set -ex
          cd ~
          curl -O https://repo.anaconda.com/miniconda/Miniconda3-latest-MacOSX-arm64.sh &> /dev/null
          sh Miniconda3-latest-MacOSX-arm64.sh -b
      - name: Install Additional Conda Packages
        run: |
          source ~/miniconda3/bin/activate
          set -ex
          conda init &> /dev/null
          conda update -n base conda -y &> /dev/null
          conda install -c conda-forge conda-build anaconda-client -y &> /dev/null
      - name: Build Conda Package
        env:
          accountName: ${{ secrets.ANACONDA_ACCOUNTNAME }}
          token: ${{ secrets.ANACONDA_TOKEN }}
          FAST_WAVES: "OFF"
          SIMD_EXTENSIONS: "none"
        run: |
          source ~/miniconda3/bin/activate
          set -ex
          cd binders
          conda config --set anaconda_upload yes
          conda build -m conda_build_config.yaml -c conda-forge . -k \
            --user $accountName \
            --token $token \
            | tee build.log
          if [ $(find ~/miniconda3/conda-bld/osx-arm64 -name "binders*" | wc -l ) = 1 ]; then echo Success! ; else exit 1; fi
      - name: Archive Build Logs
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: "Anaconda_Build_MACOS_Log"
          path: binders/build.log